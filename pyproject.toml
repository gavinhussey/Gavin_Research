[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-quant"
version = "0.1.0"
description = "AtlasQuant — a read-only, multi-strategy quantitative research and backtesting platform. First strategy: Filing Momentum ML (formerly developed as ArnoldQuantML / FilingEdgeML in a separate legacy repository — see docs/naming_migration.md)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Stage 10: none of these are installed by default, and the core package
# must keep importing without them (verified by tests/_safety.py-adjacent
# import-smoke tests). Install only the group(s) a given task needs.
model = ["scikit-learn>=1.3.0,<2.0.0", "joblib>=1.3.0"]
production-data = ["requests>=2.31.0", "pyarrow>=14.0.0", "yfinance>=0.2.40", "lxml>=5.0.0"]
notebooks = ["jupyter>=1.0.0", "nbformat>=5.9.0"]
research = ["atlas-quant[model,production-data,notebooks]"]

[project.scripts]
atlas-quant = "atlas_quant.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` must be safe by default — network, external-env (e.g. a
# separate Python env needed for an optional heavy dependency),
# slow (full historical backtests), and production_data tests are opt-in
# only. See tests/conftest.py and tests/_safety.py.
addopts = "-m \"not network and not external_env and not slow and not production_data\""
